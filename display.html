<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kape' Bar-Rio · Order Display</title><link rel="stylesheet" href="sync.css"><style>*{box-sizing:border-box}body{margin:0;background:#f7f2eb;color:#503827;font:16px system-ui}header{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font:700 28px Georgia;margin:0}header a,header button{color:#503827;background:white;border:1px solid #d8c7b5;border-radius:8px;padding:10px;text-decoration:none;font:inherit}main{padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.order{background:white;border:1px solid #ded1c2;border-top:7px solid #a96d33;border-radius:15px;padding:18px}.order.paid{border-top-color:#386944}.order h2{margin:0 0 8px;font-size:26px}.order small{display:block;color:#786658;line-height:1.5}.item{margin:14px 0;padding-top:12px;border-top:1px solid #ede4db}.item b{font-size:18px}.badge{display:inline-block;background:#f4e4cf;border-radius:7px;padding:5px 8px;font-weight:700}.paid .badge{background:#e1efdd}#empty{padding:40px;text-align:center;font-size:22px}#lastUpdate{font-size:13px}</style></head><body><header><div><h1>Order Display</h1><span id="lastUpdate">Connecting…</span></div><div><a href="index.html">Ordering / Barista</a> <button onclick="KBRCloud.logout()">Sign out</button></div></header><main id="orders"></main><p id="empty" hidden>No open orders.</p><script src="sync-config.js"></script><script src="sync-core.js"></script><script src="display.js"></script></body></html>
