<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kape Bar-Rio Promo Codes</title><link rel="stylesheet" href="sync.css"><style>body{font-family:system-ui;background:#f7f1e9;margin:0;color:#4e3528}main{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #eadfd4;border-radius:12px;padding:12px}.stat b{font-size:28px;display:block}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #eee3d7;text-align:left}.code{font-family:monospace;font-weight:900}</style></head><body><main><div class="card"><h1>Promo Codes</h1><button onclick="location.href='index.html'">Back</button> <button onclick="load()">Refresh</button><div class="stats"><div class="stat">Active<b id="a">0</b></div><div class="stat">Given<b id="g">0</b></div><div class="stat">Redeemed<b id="r">0</b></div></div><div class="wrap"><table><thead><tr><th>Code</th><th>Status</th><th>Given</th><th>Redeemed</th><th>Drink</th><th>Order</th></tr></thead><tbody id="rows"></tbody></table></div><p id="msg"></p></div></main><script src="sync-config.js"></script><script src="sync-core.js"></script><script>const dt=v=>v?new Date(v).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'—';async function load(){try{if(!KBRCloud.requireLogin())return;const d=await KBRCloud.rpc('kbr_pos_promo_codes_admin',{});a.textContent=d.filter(x=>x.status==='active').length;g.textContent=d.filter(x=>x.status==='given').length;r.textContent=d.filter(x=>x.status==='redeemed').length;rows.innerHTML=d.map(x=>`<tr><td class=code>${x.code}</td><td>${x.status}</td><td>${dt(x.given_at)}</td><td>${dt(x.redeemed_at)}</td><td>${x.drink||'—'}</td><td>${x.order_number||'—'}</td></tr>`).join('')}catch(e){msg.textContent=e.message}}load()</script></body></html>
