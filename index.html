<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3825">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kape' Bar-Rio POS">
<link rel="manifest" href="manifest.json">

<title>Kape' Bar-Rio POS</title>
<style>
:root{--brown:#6b4328;--cream:#fbf7f0;--ink:#211b17;--tan:#d9c1a6;--green:#6e8b48;--card:#fff;--shadow:0 8px 25px rgba(60,40,25,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(251,247,240,.96);backdrop-filter:blur(12px);border-bottom:1px solid #eadfD2;padding:14px 18px 10px}
.brand{display:flex;align-items:center;gap:12px;max-width:1500px;margin:auto}
.brand img{width:58px;height:58px;object-fit:cover;border-radius:14px;border:1px solid #eadfd2}
.brand h1{font-family:Georgia,serif;margin:0;color:var(--brown);font-size:24px}
.brand small{color:#7e6a59}
main{max-width:1500px;margin:auto;padding:16px 18px 150px}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}
.tabs button{white-space:nowrap;border:1px solid #d8c7b5;background:#fff;border-radius:999px;padding:11px 16px;font-weight:700;color:#654a36}
.tabs button.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.product-img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:14px;margin-bottom:10px;display:block}
.card{overflow:hidden}
.card{background:var(--card);border:1px solid #eee3d7;border-radius:18px;padding:12px;box-shadow:var(--shadow);min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.card h3{font-size:18px;line-height:1.15;margin:0 0 8px;text-align:center}
.price{color:var(--brown);font-weight:800;font-size:15px}
.card button{margin-top:14px;border:0;border-radius:13px;background:#f0e3d5;color:#5b3825;font-weight:800;padding:12px;min-height:46px;font-size:16px}
.card button:active{transform:scale(.98)}
#products{touch-action:pan-y;transition:opacity .14s ease,transform .14s ease;overscroll-behavior-x:contain}
#products.swipe-out-left{opacity:.15;transform:translateX(-28px)}
#products.swipe-out-right{opacity:.15;transform:translateX(28px)}
.swipe-hint{display:none;text-align:center;color:#8a7868;font-size:13px;margin:-4px 0 12px}
.menu-toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:60;pointer-events:none;opacity:0;background:rgba(33,27,23,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:24px 34px;border-radius:24px;font-family:Georgia,serif;font-size:34px;font-weight:700;box-shadow:0 18px 55px rgba(0,0,0,.28);white-space:nowrap;transition:opacity .2s ease,transform .2s ease;text-align:center}
.menu-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:699px){.menu-toast{font-size:28px;padding:20px 26px;max-width:82vw;white-space:normal}}
@media(max-width:699px){.swipe-hint{display:block}}
.sectionTitle{font-family:Georgia,serif;color:var(--brown);font-size:24px;margin:10px 0 14px}
.floating-history{position:fixed;right:18px;top:calc(50% - 86px);transform:translateY(-50%);z-index:40;width:66px;height:66px;border:0;border-radius:50%;background:#8a674a;color:#fff;box-shadow:0 8px 25px rgba(60,40,25,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}.floating-history:active{transform:translateY(-50%) scale(.96)}.history-icon{font-size:29px;line-height:1}.history-badge{position:absolute;right:-3px;top:-3px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:#d9483e;color:#fff;border:3px solid var(--cream);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}.floating-cart{position:fixed;right:18px;top:calc(50% + 1px);transform:translateY(-50%);z-index:40;width:66px;height:66px;border:0;border-radius:50%;background:var(--brown);color:#fff;box-shadow:0 8px 25px rgba(60,40,25,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
.floating-cart:active{transform:translateY(-50%) scale(.96)}
.cart-icon{font-size:29px;line-height:1}
.cart-badge{position:absolute;right:-3px;top:-3px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:#d9483e;color:#fff;border:3px solid var(--cream);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.primary{border:0;border-radius:14px;background:var(--brown);color:#fff;padding:14px 20px;font-size:16px;font-weight:800;min-height:52px}
.secondary{border:1px solid #d9c7b5;background:#fff;border-radius:12px;padding:11px 14px;font-weight:700}
.drawer{position:fixed;inset:0;background:rgba(24,17,12,.45);z-index:50;display:none;align-items:flex-end}
.drawer.open{display:flex}
.panel{background:var(--cream);width:100%;max-height:88vh;border-radius:24px 24px 0 0;padding:20px;overflow:auto}
.panel h2{margin:0 0 4px;color:var(--brown);font-family:Georgia,serif}.selector-image{display:block;width:180px;height:180px;object-fit:contain;background:#fff;border-radius:18px;margin:10px auto 14px;border:1px solid #eadfd4}
.muted{color:#7a6b60}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.opt{border:2px solid #dfd1c2;background:#fff;border-radius:14px;padding:17px 8px;text-align:center;font-weight:800;font-size:20px;line-height:1.15}
.opt.selected{border-color:var(--brown);background:#f2e6d9}
.opt span{display:block;color:var(--brown);margin-top:7px;font-size:19px;font-weight:900}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.qty{display:flex;align-items:center;justify-content:center;gap:15px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid #d7c6b5;background:#fff;font-size:22px}
.order-list{display:flex;flex-direction:column;gap:10px;margin:10px 0 18px}
.order-item{background:#fff;border:1px solid #eadfd4;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.order-item .desc{flex:1}.order-item strong{color:var(--brown)}.cart-drawer-total{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;padding-top:14px;border-top:1px solid #eadfd4}.cart-drawer-total b:last-child{font-size:22px;color:var(--brown)}.order-qty{display:flex;align-items:center;gap:7px;margin-top:8px}.order-qty button{width:30px;height:30px;border-radius:9px;border:1px solid #d9c7b5;background:#fff;font-weight:800}

.empty{padding:40px 10px;text-align:center;color:#857568}
.receipt{background:#fff;max-width:480px;margin:0 auto;padding:30px 44px;font-family:"Courier New",monospace;color:#111;box-sizing:border-box}
.receipt .center{text-align:center}.receipt h3{margin:0 0 5px;font-size:21px}.receipt .receipt-number{display:block;text-align:center;font-weight:700;letter-spacing:.5px;margin-top:4px}.receipt hr{border:0;border-top:1px dashed #777;margin:14px 0}
.receipt-line{display:flex;justify-content:space-between;gap:10px;margin:7px 0}.receipt .item{flex:1}
.receipt-actions{display:flex;gap:10px;max-width:480px;margin:14px auto 0}.receipt-actions button{flex:1;min-height:46px}
.notice{background:#edf5e6;color:#45652b;border:1px solid #cfe0be;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}.panel{max-width:760px;margin:auto;border-radius:24px}.drawer{align-items:center;padding:20px}}
@media(max-width:699px){.floating-history{right:14px;top:calc(50% - 76px);width:60px;height:60px}.history-icon{font-size:25px}.history-badge{min-width:22px;height:22px;font-size:11px}.floating-cart{right:14px;top:calc(50% + 1px);width:60px;height:60px}.cart-icon{font-size:27px}.cart-badge{min-width:24px;height:24px;font-size:12px}}

.history-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}.history-item{background:#fff;border:1px solid #eadfd4;border-radius:16px;padding:14px}.history-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.history-head b{color:var(--brown);font-size:17px}.history-meta{color:#7a6b60;font-size:13px;margin-top:3px}.history-total{font-weight:900;color:var(--brown);font-size:18px;white-space:nowrap}.history-items{margin:10px 0;color:#4e4137;font-size:14px;line-height:1.45}.history-actions{display:flex;gap:8px}.history-actions button{flex:1;min-height:44px}.history-empty{padding:50px 12px;text-align:center;color:#857568}.history-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-title-row h2{margin:0}.history-clear{font-size:13px;padding:9px 11px}

@media(min-width:700px){#orderDrawer{align-items:stretch;justify-content:flex-end;padding:0}#orderDrawer .panel{width:390px;max-width:390px;height:100%;max-height:none;border-radius:24px 0 0 24px;margin:0;padding:22px;box-shadow:-12px 0 30px rgba(0,0,0,.16)}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.png" alt="Kape' Bar-Rio">
    <div><h1>Kape' Bar-Rio</h1><small>Shop & Cafe · POS</small></div>
  </div>
</header>
<main>
  <div id="tabs" class="tabs"></div>
  <h2 id="sectionTitle" class="sectionTitle"></h2>
  <div id="products" class="grid"></div>
  <div class="swipe-hint">Swipe left or right to browse menus</div>
<div id="menuToast" class="menu-toast" aria-live="polite"></div>
</main>

<button class="floating-history" aria-label="Open transaction history" onclick="openHistory()">
  <span class="history-icon" aria-hidden="true">🧾</span>
  <span id="historyBadge" class="history-badge">0</span>
</button>
<button class="floating-cart" aria-label="Open cart" onclick="openOrder()">
  <span class="cart-icon" aria-hidden="true">🛒</span>
  <span id="cartBadge" class="cart-badge">0</span>
</button>

<div id="historyDrawer" class="drawer" onclick="if(event.target===this)closeHistory()">
  <div class="panel">
    <div class="history-title-row">
      <h2>Transaction History</h2>
      <button class="secondary history-clear" onclick="clearHistory()">Clear history</button>
    </div>
    <div class="muted" style="margin:4px 0 12px">Saved on this iPad. Tap “Save picture” for any transaction.</div>
    <div id="historyList" class="history-list"></div>
    <button class="secondary" style="width:100%;margin-top:12px" onclick="closeHistory()">Close</button>
  </div>
</div>

<div id="selector" class="drawer" onclick="if(event.target===this)closeSelector()">
  <div class="panel">
    <h2 id="selName" style="text-align:center"></h2><img id="selImage" class="selector-image" alt=""><div id="selType" class="muted" style="text-align:center"></div>
    <div id="premiumWrap" style="display:none">
      <p><b>Choose type</b></p><div id="typeOptions" class="options"></div>
    </div>
    <p><b>Choose size</b></p><div id="sizeOptions" class="options"></div>
    <div class="row">
      <div class="qty"><button onclick="changeQty(-1)">−</button><b id="selQty">1</b><button onclick="changeQty(1)">+</button></div>
      <button class="primary" onclick="addSelected()">Add to order</button>
    </div>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="closeSelector()">Cancel</button>
  </div>
</div>

<div id="orderDrawer" class="drawer" onclick="if(event.target===this)closeOrder()">
  <div class="panel">
    <h2>Your Cart</h2>
    <div class="muted" style="margin:4px 0 12px">Review your drinks before checkout.</div>
    <div id="orderList" class="order-list"></div>
    <div id="cartDrawerTotal" class="cart-drawer-total"><span>Total</span><b>₱0</b></div>
    <div class="row"><button class="secondary" onclick="clearOrder()">Clear</button><button class="primary" onclick="makeReceipt()">Pay</button></div>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="closeOrder()">Continue ordering</button>
  </div>
</div>

<div id="receiptDrawer" class="drawer" onclick="if(event.target===this)closeReceipt()">
  <div class="panel">
    <div id="receiptArea"></div>
    <div class="receipt-actions">
      <button class="secondary" onclick="closeReceipt()">Close</button>
      <button class="primary" onclick="payAtCounter()">Pay at the counter</button>
    </div>
  </div>
</div>

const cats=[...new Set(PRODUCTS.map(p=>p.category))];

function renderTabs(){
  tabs.innerHTML=cats.map(c=>`<button class="${c===category?'active':''}" onclick="category=${JSON.stringify(c)};render()">${c}</button>`).join("");

  renderTabs();

let swipeStartX=0, swipeStartY=0, swipeStartTime=0;
const CATEGORY_LABELS={
  "Milk Tea Series":"Milk Tea",
  "Coffee Series":"Coffee Drinks",
  "Matcha Series":"Matcha Drinks",
  "Soda":"Fruit Soda Series",
  "Floats":"Floats",

};
let toastTimer=null;
function showMenuToast(name){
  menuToast.textContent=CATEGORY_LABELS[name]||name;
  menuToast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>menuToast.classList.remove("show"),1200);

function goToCategory(direction){
  const current=cats.indexOf(category);
  if(current<0) return;
  const next=(current+direction+cats.length)%cats.length;
  if(next===current) return;
  const cls=direction>0?'swipe-out-left':'swipe-out-right';
  products.classList.add(cls);
  setTimeout(()=>{
    category=cats[next];
    render();
    products.classList.remove(cls);
    showMenuToast(category);
    const activeTab=[...tabs.querySelectorAll('button')][next];
    activeTab?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  },120);
}
products.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
  swipeStartTime=Date.now();
},{passive:true});
products.addEventListener('touchend',e=>{
  if(!swipeStartTime || e.changedTouches.length!==1) return;
  const dx=e.changedTouches[0].clientX-swipeStartX;
  const dy=e.changedTouches[0].clientY-swipeStartY;
  const dt=Date.now()-swipeStartTime;
  swipeStartTime=0;
  if(dt>700 || Math.abs(dx)<70 || Math.abs(dx)<Math.abs(dy)*1.35) return;
  goToCategory(dx<0?1:-1);
},{passive:true});

function chooseProduct(p){
  selected={p,type:p.premium?'budget':'standard',sizeIndex:0,qty:1};
  selName.textContent=p.name;
  selImage.src=p.image||"";
  selImage.alt=p.name;
  selImage.style.display=p.image?"block":"none";
  premiumWrap.style.display=p.premium?'block':'none';
  if(p.premium) renderTypes(); else selType.textContent="Select size";
  renderSizes();
  selQty.textContent=1;
  selector.classList.add("open");
}
function renderTypes(){
  typeOptions.innerHTML=`<button class="opt ${selected.type==='budget'?'selected':''}" onclick="selected.type='budget';renderTypes();renderSizes()">Budget</button>
  <button class="opt ${selected.type==='premium'?'selected':''}" onclick="selected.type='premium';renderTypes();renderSizes()">Premium</button>`;
}
function renderSizes(){
  const p=selected.p, sizes=selected.type==='premium'&&p.premiumSizes?p.premiumSizes:(p.sizes||SIZE_DEFAULT);
  const prices=selected.type==='premium'?p.premium:p.prices;
  selected.sizeIndex=Math.min(selected.sizeIndex,prices.length-1);
  sizeOptions.innerHTML=sizes.map((s,i)=>`<button class="opt ${i===selected.sizeIndex?'selected':''}" onclick="selected.sizeIndex=${i};renderSizes()">${s}<span>${peso(prices[i])}</span></button>`).join("");
  selType.textContent=selected.type==='premium'?'Premium':'Budget / Standard';
}
function changeQty(d){selected.qty=Math.max(1,selected.qty+d);selQty.textContent=selected.qty}
function addSelected(){
  const p=selected.p, sizes=selected.type==='premium'&&p.premiumSizes?p.premiumSizes:(p.sizes||SIZE_DEFAULT);
  const prices=selected.type==='premium'?p.premium:p.prices;
  const item={name:p.name,category:p.category,type:selected.type,size:sizes[selected.sizeIndex],price:prices[selected.sizeIndex],qty:selected.qty};
  const key=JSON.stringify([item.name,item.type,item.size,item.price]);
  const old=cart.find(x=>x.key===key);
  if(old) old.qty+=item.qty; else {item.key=key;cart.push(item)}
  persist();closeSelector();render();
}
function persist(){localStorage.setItem("kbr_cart",JSON.stringify(cart))}
function updateCartBar(){
  const count=cart.reduce((s,x)=>s+x.qty,0);
  cartBadge.textContent=count>99?'99+':String(count);
  cartBadge.style.display=count?'flex':'none';
  historyBadge.textContent=history.length>99?'99+':String(history.length);
  historyBadge.style.display=history.length?'flex':'none';
}

function persistHistory(){localStorage.setItem("kbr_history",JSON.stringify(history));updateCartBar()}
function saveTransactionToHistory(receipt){
  history.unshift(JSON.parse(JSON.stringify(receipt)));
  if(history.length>200) history=history.slice(0,200);
  persistHistory();
}
function openHistory(){renderHistory();historyDrawer.classList.add("open")}
function closeHistory(){historyDrawer.classList.remove("open")}
function renderHistory(){
  if(!history.length){historyList.innerHTML='<div class="history-empty">No transactions yet.<br>Completed orders will appear here.</div>';return}
  historyList.innerHTML=history.map((r,i)=>{
    const summary=r.items.map(x=>`${x.qty}× ${x.name} (${x.size})`).join('<br>');
    return `<div class="history-item"><div class="history-head"><div><b>Order #${r.no}</b><div class="history-meta">${r.date} · ${r.time}</div></div><div class="history-total">${peso(r.total)}</div></div><div class="history-items">${summary}</div><div class="history-actions"><button class="primary" onclick="saveHistoryReceipt(${i})">Save picture</button></div></div>`;
  }).join('');
}
function clearHistory(){
  if(!history.length) return;
  if(confirm('Clear all transaction history from this iPad?')){history=[];persistHistory();renderHistory()}
}
async function saveHistoryReceipt(index){
  const r=history[index];
  if(!r) return;
  try{await saveReceipt(r)}catch(err){console.error('History receipt save failed',err);alert('Could not save the receipt picture. Please try again.')}
}

function changeCartQty(i,d){cart[i].qty=Math.max(0,cart[i].qty+d);if(cart[i].qty===0)cart.splice(i,1);persist();render();renderOrder()}
function openOrder(){renderOrder();orderDrawer.classList.add("open")}
function closeOrder(){orderDrawer.classList.remove("open")}
function renderOrder(){
  const total=cart.reduce((s,x)=>s+x.qty*x.price,0);
  cartDrawerTotal.innerHTML=`<span>Total</span><b>${peso(total)}</b>`;
  if(!cart.length){orderList.innerHTML='<div class="empty">Your cart is empty.<br>Add a drink to get started.</div>';return}
  orderList.innerHTML=cart.map((x,i)=>`<div class="order-item"><div class="desc"><b>${x.name}</b><br><small>${x.type!=='standard'?x.type+' · ':''}${x.size} · ${peso(x.price)} each</small><div class="order-qty"><button onclick="changeCartQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeCartQty(${i},1)">+</button></div></div><strong>${peso(x.price*x.qty)}</strong></div>`).join("");
}
function clearOrder(){if(confirm("Clear this order?")){cart=[];persist();render();renderOrder()}}
function closeSelector(){selector.classList.remove("open")}
function closeReceipt(){receiptDrawer.classList.remove("open")}
function orderNumber(){
  let n=Number(localStorage.getItem("kbr_order_no")||0)+1;localStorage.setItem("kbr_order_no",String(n));return String(n).padStart(5,"0")
}
let currentReceipt=null;
async function makeReceipt(){
  if(!cart.length){alert("Add at least one item.");return}
  const no=orderNumber(), now=new Date(), total=cart.reduce((s,x)=>s+x.qty*x.price,0);
  const date=now.toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"});
  const time=now.toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"});
  currentReceipt={no,date,time,total,items:JSON.parse(JSON.stringify(cart))};
  saveTransactionToHistory(currentReceipt);
  receiptArea.innerHTML=`<div id="receiptCanvas" class="receipt">
    <div class="center"><h3>KAPE' BAR-RIO</h3><div>SHOP & CAFE</div><div class="receipt-number">Order #${no}</div><div>${date} · ${time}</div></div>
    <hr>${currentReceipt.items.map(x=>`<div class="receipt-line"><div class="item">${x.qty}× ${x.name}<br><small>${x.type!=='standard'?x.type+' · ':''}${x.size}</small></div><div>${peso(x.qty*x.price)}</div></div>`).join("")}
    <hr><div class="receipt-line"><b>TOTAL</b><b>${peso(total)}</b></div><hr><div class="center">Thank you!</div>
  </div>`;

  closeOrder();
  receiptDrawer.classList.add("open");

  // Automatically download the receipt as PNG as soon as Pay is pressed.
  try {
    await saveReceipt();
  } catch (err) {
    console.error("Receipt PNG save failed", err);
  }

  // Checkout is complete: clear the cart so the next customer starts fresh.
  cart=[];
  persist();
  render();
  renderOrder();
}

async function saveReceipt(receipt=currentReceipt){
  if(!receipt) return;
  const el=document.getElementById("receiptCanvas");

  // Build the PNG directly from the saved transaction data. This also works
  // when saving an older transaction from History, where no receipt drawer is open.
  const receiptWidth=el?Math.max(el.offsetWidth,420):480;
  const receiptHeight=el?Math.max(el.offsetHeight,260):Math.max(260,220+(receipt.items.length*55));

  // Build the PNG synchronously from the receipt data so iOS keeps the
  // original Pay button user-gesture permission for the Share sheet.
  const scale=2;
  const w=receiptWidth;
  const h=receiptHeight;
  const canvas=document.createElement("canvas");
  canvas.width=w*scale;
  canvas.height=h*scale;
  const ctx=canvas.getContext("2d");
  ctx.scale(scale,scale);
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,w,h);

  const centerLines=[
    "KAPE' BAR-RIO",
    "SHOP & CAFE",
    `Order #${receipt.no}`,
    `${receipt.date} · ${receipt.time}`
  ];
  let y=42;
  ctx.fillStyle="#111";
  ctx.textAlign="center";
  centerLines.forEach((line,i)=>{
    ctx.font=i===0?"bold 28px monospace":(i===2?"bold 20px monospace":"18px monospace");
    ctx.fillText(line,w/2,y);
    y+=30;
  });

  y+=8;
  ctx.textAlign="left";
  receipt.items.forEach(x=>{
    ctx.font="18px monospace";
    ctx.fillText(`${x.qty}× ${x.name}`,28,y);
    ctx.textAlign="right";
    ctx.fillText(peso(x.qty*x.price),w-28,y);
    ctx.textAlign="left";
    y+=27;
    ctx.font="15px monospace";
    ctx.fillText(`${x.type!=='standard'?x.type+' · ':''}${x.size}`,44,y);
    y+=28;
  });
  ctx.font="bold 20px monospace";
  ctx.fillText("TOTAL",28,y);
  ctx.textAlign="right";
  ctx.fillText(peso(receipt.total),w-28,y);
  ctx.textAlign="center";
  y+=34;
  ctx.font="18px monospace";
  ctx.fillText("Thank you!",w/2,y);

  // Crop the PNG to the actual content height while keeping generous side space.
  const finalCanvas=document.createElement("canvas");
  finalCanvas.width=w*scale;
  finalCanvas.height=Math.ceil((y+28)*scale);
  const fctx=finalCanvas.getContext("2d");
  fctx.drawImage(canvas,0,0);

  const dataUrl=finalCanvas.toDataURL("image/png");
  const byteString=atob(dataUrl.split(",")[1]);
  const bytes=new Uint8Array(byteString.length);
  for(let i=0;i<byteString.length;i++) bytes[i]=byteString.charCodeAt(i);
  const file=new File([bytes],`Kape-Bar-Rio-Receipt-${receipt.no}.png`,{type:"image/png"});

  const isStandalone=window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
  if(isStandalone && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    // iPad/iPhone Home Screen apps cannot reliably use <a download>.
    // Use the native Share sheet instead; the customer can choose Save Image
    // or Save to Files. This is the supported way to export a PNG from a PWA.
    try{
      await navigator.share({title:`Kape' Bar-Rio Receipt #${receipt.no}`,files:[file]});
      return;
    }catch(err){
      // If the customer closes the Share sheet, fall back to a normal download.
      if(err && err.name==='AbortError') return;
    }
  }

  // Normal Safari/desktop browser: direct PNG download.
  const url=URL.createObjectURL(file);
  const a=document.createElement("a");
  a.href=url;
  a.download=file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function payAtCounter(){
  closeReceipt();
}
