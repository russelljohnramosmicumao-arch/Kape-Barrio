<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6b3f24">
  <title>KBR Rewards</title>
  <link rel="stylesheet" href="rewards.css?v=62">
</head>
<body>
  <header class="rewards-topbar rewards-app-header">
    <div class="rewards-brand">Kape’ Bar-Rio</div>

    <div class="rewards-title">Rewards</div>

    <div class="rewards-actions">
      <button id="rewardsCartButton" class="rewards-action rewards-cart-action" type="button" aria-label="Open cart">
        <span class="rewards-cart-icon-wrap" aria-hidden="true">
          🛒
          <span id="rewardsCartCount" class="rewards-cart-count">0</span>
        </span>
        <small>Cart</small>
      </button>

      <button id="rewardsPointsButton" class="rewards-action rewards-points-action" type="button">
        <span class="rewards-action-main"><span id="rewardsHeaderPoints">0</span> pts</span>
        <small>Click to redeem</small>
      </button>

      <button id="rewardsAccountButton" class="rewards-action rewards-account-action" type="button">
        <span class="rewards-account-icon">👤</span>
        <small>My Account</small>
      </button>
    </div>
  </header>

  <main class="rewards-shell">
    <section class="balance-card">
      <div>
        <div class="eyebrow light">Your KBR Points</div>
        <div id="pointsBalance" class="points-balance">0</div>
      </div>
      <div class="reward-value-box">
        <span>Unlocked reward value</span>
        <strong id="rewardValue">₱0</strong>
      </div>
    </section>

    <p class="rule-note">
      ₱1 spent on eligible drinks = 1 point. Food and ice cream do not earn points.
      Every 1,000 points unlocks ₱50 of reward value.
    </p>

    <section>
      <div class="section-heading">
        <div>
          <div class="eyebrow">Available to you</div>
          <h2>Reward drinks you can afford</h2>
        </div>
      </div>

      <div id="rewardCategoryBar" class="reward-category-bar"></div>
      <h3 id="rewardCategoryTitle" class="reward-category-title"></h3>
      <div id="rewardGrid" class="reward-grid"></div>
      <div id="rewardEmpty" class="empty-state hidden">
        You don't have enough points for a drink yet.
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="rewards.js?v=62" defer></script>
</body>
</html>
