name: Mirror KBR Menu Pictures to GitHub

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kbr-menu-picture-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Ordering repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Mirror cloud pictures for menu items
        env:
          KBR_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AXZtXN81wyM_W7tVZuJ-zw_ohoaj-1M
        run: python3 scripts/sync_menu_images.py
      - name: Commit new menu pictures
        run: |
          git config user.name "KBR Menu Photo Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/menu-managed/
          if git diff --staged --quiet; then
            echo "No changed pictures to publish"
          else
            git commit -m "Mirror newly uploaded KBR menu pictures"
            git push
          fi
